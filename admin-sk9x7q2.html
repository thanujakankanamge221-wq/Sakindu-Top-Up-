<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | SakinduStore</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap{max-width:1000px;margin:0 auto;padding:40px 5%;}
  .admin-table{width:100%;border-collapse:collapse;margin-top:16px;}
  .admin-table th,.admin-table td{padding:12px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem;}
  .admin-table th{color:var(--cyan);font-family:'Orbitron';font-size:.75rem;letter-spacing:.5px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:30px;}
  .stat-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;}
  .stat-card .num{font-family:'Orbitron';font-size:1.6rem;font-weight:800;color:var(--gold);}
  .stat-card .lbl{color:var(--muted);font-size:.82rem;margin-top:4px;}
  .mini-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;font-size:.8rem;margin-right:6px;}
  .mini-btn.done{border-color:var(--green);color:var(--green);}
  .mini-btn.del{border-color:var(--red);color:var(--red);}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:20px;padding:36px;max-width:380px;width:100%;}
  .login-box input{width:100%;padding:13px 16px;margin-bottom:14px;border-radius:10px;
    background:var(--bg-deep);border:1px solid var(--line);color:var(--text);font-family:'Rajdhani';font-size:1rem;}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h2 style="margin-bottom:6px;">🔒 Admin Access</h2>
    <p style="color:var(--muted);margin-bottom:20px;font-size:.9rem;">SakinduStore Management Panel</p>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button class="btn btn-primary btn-block" onclick="adminLogin()">Login</button>
    <div id="adminMsg" class="verify-status" style="margin-top:10px;"></div>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <header>
    <div class="logo">Sakindu<span>Admin</span></div>
    <button class="btn btn-ghost btn-sm" onclick="adminLogout()">Logout</button>
  </header>

  <div class="admin-wrap">
    <div class="stat-grid">
      <div class="stat-card"><div class="num" id="statOrders">0</div><div class="lbl">Total Orders</div></div>
      <div class="stat-card"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
      <div class="stat-card"><div class="num" id="statRevenue">0</div><div class="lbl">Revenue (Rs.)</div></div>
      <div class="stat-card"><div class="num" id="statUsers">0</div><div class="lbl">Registered Users</div></div>
    </div>

    <h3>📦 Orders</h3>
    <table class="admin-table">
      <thead><tr><th>UID</th><th>Player</th><th>Package</th><th>Amount</th><th>Payment</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
      <tbody id="ordersBody"></tbody>
    </table>

    <h3 style="margin-top:34px;">👥 Registered Users</h3>
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Phone</th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>

    <h3 style="margin-top:34px;">🎁 Redeemed Codes</h3>
    <table class="admin-table">
      <thead><tr><th>Code</th></tr></thead>
      <tbody id="codesBody"></tbody>
    </table>
  </div>
</div>

<script>
  const ADMIN_USER = 'admin';
  const ADMIN_PASS = 'sakindu123';

  function adminLogin(){
    const u = document.getElementById('adminUser').value;
    const p = document.getElementById('adminPass').value;
    const msg = document.getElementById('adminMsg');
    if(u === ADMIN_USER && p === ADMIN_PASS){
      sessionStorage.setItem('sakindu_admin_auth', '1');
      showDashboard();
    } else {
      msg.textContent = '❌ Invalid credentials.';
    }
  }
  function adminLogout(){
    sessionStorage.removeItem('sakindu_admin_auth');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }
  function showDashboard(){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderAll();
  }

  function renderAll(){
    const orders = JSON.parse(localStorage.getItem('sakindu_orders') || '[]');
    const users = JSON.parse(localStorage.getItem('sakindu_users') || '{}');
    const codes = JSON.parse(localStorage.getItem('sakindu_redeemed') || '[]');

    document.getElementById('statOrders').textContent = orders.length;
    document.getElementById('statPending').textContent = orders.filter(o=>o.status==='Pending').length;
    document.getElementById('statRevenue').textContent = orders.reduce((s,o)=>s+o.amount,0);
    document.getElementById('statUsers').textContent = Object.keys(users).length;

    document.getElementById('ordersBody').innerHTML = orders.length ? orders.map((o,i)=>`
      <tr>
        <td>${o.uid}</td><td>${o.player || '-'}</td><td>${o.package}</td><td>Rs. ${o.amount}</td><td>${o.payment}</td><td>${o.date}</td>
        <td>${o.status}</td>
        <td>
          <button class="mini-btn done" onclick="markDone(${i})">✔ Done</button>
          <button class="mini-btn del" onclick="deleteOrder(${i})">🗑</button>
        </td>
      </tr>`).join('') : `<tr><td colspan="8" style="color:var(--muted);text-align:center;">No orders yet.</td></tr>`;

    document.getElementById('usersBody').innerHTML = Object.keys(users).length ? Object.entries(users).map(([phone,u])=>`
      <tr><td>${u.name}</td><td>${phone}</td></tr>`).join('') : `<tr><td colspan="2" style="color:var(--muted);text-align:center;">No users yet.</td></tr>`;

    document.getElementById('codesBody').innerHTML = codes.length ? codes.map(c=>`<tr><td>${c}</td></tr>`).join('') : `<tr><td style="color:var(--muted);text-align:center;">No codes redeemed yet.</td></tr>`;
  }

  function markDone(i){
    const orders = JSON.parse(localStorage.getItem('sakindu_orders') || '[]');
    orders[i].status = 'Done';
    localStorage.setItem('sakindu_orders', JSON.stringify(orders));
    renderAll();
  }
  function deleteOrder(i){
    const orders = JSON.parse(localStorage.getItem('sakindu_orders') || '[]');
    orders.splice(i,1);
    localStorage.setItem('sakindu_orders', JSON.stringify(orders));
    renderAll();
  }

  if(sessionStorage.getItem('sakindu_admin_auth') === '1'){ showDashboard(); }
</script>
</body>
</html>
